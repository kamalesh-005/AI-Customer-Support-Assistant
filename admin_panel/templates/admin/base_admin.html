<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - AI Customer Support Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='admin.css') }}">
</head>

<body class="admin-body">

<div class="admin-wrapper">

    <!-- Sidebar -->
    <div class="admin-sidebar">
        <span class="brand">🛠️ Admin Panel</span>

        <nav class="nav flex-column">
            <a class="nav-link {% if request.endpoint == 'admin.admin_dashboard' %}active{% endif %}"
               href="{{ url_for('admin.admin_dashboard') }}">
                📊 Dashboard
            </a>
            <a class="nav-link {% if request.endpoint in ['admin.admin_tickets', 'admin.admin_ticket_detail'] %}active{% endif %}"
               href="{{ url_for('admin.admin_tickets') }}">
                🎫 Tickets
            </a>
            <a class="nav-link" href="/" target="_blank">
                🌐 View Site
            </a>
            <a class="nav-link" href="{{ url_for('admin.admin_logout') }}">
                🚪 Logout
            </a>
        </nav>
    </div>

    <!-- Main content -->
    <div class="admin-content">

        <div class="admin-topbar">
            <h4 class="mb-0">{% block page_title %}Dashboard{% endblock %}</h4>
            <div class="text-muted">
                Signed in as <strong>{{ admin_username }}</strong>
            </div>
        </div>

        {% block content %}{% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

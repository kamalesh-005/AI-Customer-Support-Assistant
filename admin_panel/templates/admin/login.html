<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AI Customer Support Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='admin.css') }}">
</head>

<body>

<div class="admin-login-wrapper">
    <div class="admin-login-card">

        <h4 class="mb-1 text-center">🛠️ Admin Login</h4>
        <p class="text-center text-muted mb-4">AI Customer Support Assistant</p>

        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin.admin_login') }}">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Log In</button>

        </form>

        <p class="text-center text-muted mt-4 mb-0" style="font-size: 0.8rem;">
            <a href="/">← Back to site</a>
        </p>

    </div>
</div>

</body>
</html>

{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<h2 class="mb-4">✏️ Edit Profile</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input
            type="text"
            name="fullname"
            class="form-control"
            value="{{ user[1] }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input
            type="email"
            class="form-control"
            value="{{ user[2] }}"
            readonly>
    </div>

    <button type="submit" class="btn btn-success">
        💾 Save Changes
    </button>

    <a href="/profile" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI Customer Support Assistant{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        {% if request.path != "/" %}
        {% if request.path == "/chat" %}
<a href="/dashboard" class="btn btn-outline-light me-3">
    ← Dashboard
</a>

{% elif request.path != "/" %}
<a href="javascript:history.back()" class="btn btn-outline-light me-3">
    ← Back
</a>
{% endif %}
        {% endif %}

        <a class="navbar-brand" href="/">
            AI Customer Support Assistant
        </a>

        {% if request.path == "/" %}
        <button class="btn btn-outline-light" id="themeButton">
            🌙 Dark Mode
        </button>
        {% endif %}

    </div>

</nav>

<div class="container mt-5">

    {% block content %}
    {% endblock %}

</div>

<!-- Theme Script -->

<script>

const button = document.getElementById("themeButton");

function applyTheme() {

    const theme = localStorage.getItem("theme");

    if (theme === "dark") {

        document.body.classList.add("dark-mode");

        if (button) {
            button.innerHTML = "☀️ Light Mode";
        }

    } else {

        document.body.classList.remove("dark-mode");

        if (button) {
            button.innerHTML = "🌙 Dark Mode";
        }

    }

}

applyTheme();

if (button) {

    button.addEventListener("click", function () {

        if (localStorage.getItem("theme") === "dark") {

            localStorage.setItem("theme", "light");

        } else {

            localStorage.setItem("theme", "dark");

        }

        applyTheme();

    });

}

</script>

<!-- Bootstrap JavaScript (Required for Modal) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</body>

</html>
